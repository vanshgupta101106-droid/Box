<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Box Studio — Admin Panel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="bg-mesh"></div>

    <div id="app">
      <div id="left-panel">
        <div id="resizer"></div>

        <div class="panel-header">
          <div class="panel-title-row">
            <span class="sdot" id="statusDot"></span>
            <span class="panel-title">Box Studio</span>
          </div>
          <h1 class="sec-title">Admin Panel</h1>
        </div>

        <div class="divider"></div>

        <div class="panel-section">
          <div class="section-head">
            <div class="sec-badge no-margin"><i>📐</i> Dimensions</div>
            <div class="unit-toggle" id="unitToggle">
              <button class="unit-pill active" data-unit="mm">mm</button>
              <button class="unit-pill" data-unit="cm">cm</button>
              <button class="unit-pill" data-unit="in">in</button>
            </div>
          </div>

          <div class="dim-row">
            <div style="flex: 1">
              <div class="face-label">Length</div>
              <input
                class="field-input"
                type="number"
                id="length"
                placeholder="300"
                min="0.01"
                step="any"
              />
            </div>
            <div style="flex: 1">
              <div class="face-label">Width</div>
              <input
                class="field-input"
                type="number"
                id="width"
                placeholder="200"
                min="0.01"
                step="any"
              />
            </div>
            <div style="flex: 1">
              <div class="face-label">Height</div>
              <input
                class="field-input"
                type="number"
                id="height"
                placeholder="150"
                min="0.01"
                step="any"
              />
            </div>
          </div>

          <div id="convHint" class="conv-hint"></div>
        </div>

        <div class="divider"></div>

        <div class="panel-section">
          <div class="sec-badge dim"><i>🎨</i> Face Textures</div>
          <div class="texture-grid">
            <div>
              <div class="face-label">Front</div>
              <label class="file-drop" id="drop-frontImg">
                <div>＋ Upload</div>
                <input type="file" id="frontImg" accept="image/*" />
              </label>
            </div>
            <div>
              <div class="face-label">Back</div>
              <label class="file-drop" id="drop-backImg">
                <div>＋ Upload</div>
                <input type="file" id="backImg" accept="image/*" />
              </label>
            </div>

            <div>
              <div class="face-label">Left</div>
              <label class="file-drop" id="drop-leftImg">
                <div>＋ Upload</div>
                <input type="file" id="leftImg" accept="image/*" />
              </label>
            </div>
            <div>
              <div class="face-label">Right</div>
              <label class="file-drop" id="drop-rightImg">
                <div>＋ Upload</div>
                <input type="file" id="rightImg" accept="image/*" />
              </label>
            </div>

            <div>
              <div class="face-label">Top Front</div>
              <label class="file-drop" id="drop-topFrontImg">
                <div>＋ Upload</div>
                <input type="file" id="topFrontImg" accept="image/*" />
              </label>
            </div>
            <div>
              <div class="face-label">Top Back</div>
              <label class="file-drop" id="drop-topBackImg">
                <div>＋ Upload</div>
                <input type="file" id="topBackImg" accept="image/*" />
              </label>
            </div>

            <div class="full-span">
              <div class="face-label">Full Top (Alternative)</div>
              <label class="file-drop" id="drop-fullTopImg">
                <div>＋ Upload</div>
                <input type="file" id="fullTopImg" accept="image/*" />
              </label>
            </div>

            <div class="full-span">
              <div class="face-label">Bottom</div>
              <label class="file-drop" id="drop-bottomImg">
                <div>＋ Upload</div>
                <input type="file" id="bottomImg" accept="image/*" />
              </label>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="action-block">
          <button class="btn-gen" id="generateBtn">Generate Preview</button>
        </div>

        <div>
          <div
            class="sec-badge dim"
            style="font-size: 11px; margin-bottom: 12px"
          >
            <i>⬇</i> Export 3D
          </div>
          <div class="exp-row">
            <button class="btn-exp" id="exportGlb" disabled>GLB Format</button>
            <button class="btn-exp" id="exportUsdz" disabled>
              USDZ (iOS AR)
            </button>
          </div>
        </div>
      </div>
      <!-- End left-panel -->

      <!-- Floating Status Bar -->
      <div class="status-floater">
        <span class="status-label">Live Preview</span>
        <span id="dimReadout" class="status-value"></span>
        <div class="status-divider"></div>
        <div class="status-meta">
          <span class="sdot" id="renderDot"></span>
          <span id="renderStatus" class="status-copy">Waiting for input</span>
        </div>
      </div>

      <!-- Viewer -->
      <div id="viewer-container">
        <div id="viewer"></div>

        <!-- Floating AR Button for Mobile -->
        <button id="floatingArBtn" class="ar-float-btn" style="display: none">
          <span class="ar-icon">📦</span>
          <span>View in AR</span>
        </button>

        <div id="placeholder">
          <div class="placeholder-content">
            <div class="placeholder-icon">⬡</div>
            <div class="placeholder-title">No Preview Yet</div>
            <div class="placeholder-copy">
              Enter dimensions & click Generate
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
